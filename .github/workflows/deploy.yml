name: Deploy Frontend

on:
  workflow_dispatch:

jobs:
  deploy:
    name: 🚀 Build & Deploy Frontend to Production
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 📥 Checkout kodu
        uses: actions/checkout@v4

      - name: 🟢 Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Bağımlılıkları kur
        run: npm ci

      - name: 🔨 Production build al
        run: npm run build
        env:
          NODE_ENV: production

      - name: 📁 Build çıktısını doğrula
        run: |
          echo "📁 dist/ dizin içeriği:"
          ls -la dist/
          echo ""
          echo "📁 dist/main/:"
          ls -la dist/main/ || true
          echo ""
          echo "📁 dist/auth/:"
          ls -la dist/auth/ || true
          echo ""
          echo "📁 dist/admin/:"
          ls -la dist/admin/ || true

      - name: 🚀 Build çıktısını sunucuya aktar (SCP)
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          source: "dist/*"
          target: "/var/www/moneyanalyze"
          strip_components: 1
          overwrite: true
          rm: true

      - name: ♻️ Nginx'i yeniden yükle
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            echo "♻️ Nginx yeniden yükleniyor..."
            sudo nginx -t && sudo systemctl reload nginx
            echo "✅ Frontend deploy başarıyla tamamlandı!"
