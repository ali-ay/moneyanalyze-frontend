name: Deploy Frontend

on:
  workflow_dispatch: # GitHub web arayüzünde "Run workflow" butonunu aktif eder

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            export PATH=$PATH:/usr/bin:/usr/local/bin
            cd /var/www/moneyanalyze/frontend
            git pull origin main
            npm install
            npm run build
            # Frontend Vite SPA olduğu için PM2 restart gerekmez; 
            # build bittiğinde Nginx güncel dist/ dosyalarını anında sunar.